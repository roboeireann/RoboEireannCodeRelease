// All robots are oriented perpendicular to the line they stand on.
// 3v3 roster uses player numbers 1 (goalkeeper), 2 (defender), 3 (striker) -
// player 3 plays the forward/striker role, the equivalent of player 5's role
// in the 5v5 formation.
// x values are tied to the RC2026 S-field dimensions (Locations/Field2026-S/fieldDimensions.cfg):
// xPosOwnGoalArea = -3500, xPosOwnPenaltyArea = -2500, centerCircleRadius = 750.
// If the field size assumption changes, these need to be revisited (this file uses
// literal numbers, unlike REFormations.cfg which references FieldDimensions symbolically).
//              //
//  3           //  (opposite the centre circle, on the left sideline)
//              //
//  2       99  //  (in line with the penalty area)
//              //
//  1           //  (opposite the goal area line)
//   Own Goal   //
poses = [
  {
    playerNumber = 1;                        /*< The player number of the robot */
    position = {x = -3500; y = 3000;};       /*< The position (in global field coordinates) at which the robot is placed */
    turnedTowards = {x = -3500; y = 0;};     /*< The position (in global field coordinates) at which the robot is turned */
  },
  {
    playerNumber = 2;                        /*< The player number of the robot */
    position = {x = -2500; y = 3000;};       /*< The position (in global field coordinates) at which the robot is placed */
    turnedTowards = {x = -2500; y = 0;};     /*< The position (in global field coordinates) at which the robot is turned */
  },
  {
    playerNumber = 3;                        /*< The player number of the robot */
    position = {x = -750; y = 3000;};        /*< The position (in global field coordinates) at which the robot is placed */
    turnedTowards = {x = -750; y = 0;};      /*< The position (in global field coordinates) at which the robot is turned */
  },
  {
    playerNumber = 99;                       /*< Not a real B-Human player number, used as a temporary spare position in certain situations. Does not affect anything. */
    position = {x = -1800; y = -3000;};      /*< The position (in global field coordinates) at which the robot is placed */
    turnedTowards = {x = -1800; y = 0;};     /*< The position (in global field coordinates) at which the robot is turned */
  }
];
