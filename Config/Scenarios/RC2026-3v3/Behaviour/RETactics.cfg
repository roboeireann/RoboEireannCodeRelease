// Tactics for RC2026 3v3 games: goalkeeper + defender (standard supporter, not
// RLDefenderNeuralControl) + striker. See REFormations.cfg in this scenario for
// the corresponding formation definitions.

maxPlayers = 3; // highest jersey number used by the 3v3 roster (players 1, 2, 3)

ourKickoffFormation = {
  formationIds = [kickoffForward020];
  ballEffect = { xAnchor=0; xRange = { min=-1000; max=1000; }; scale = { x=1.0; y=1.0; }; };
};

opponentKickoffFormation = {
  formationIds = [defendingKickoff020];
  ballEffect = { xAnchor=0; xRange = { min=-1000; max=1000; }; scale = { x=1.0; y=1.0; }; };
};

attackingFormation = {
  formationIds = [attacking020];
  ballEffect = { xAnchor=0; xRange = { min=-500; max=2000; }; scale = { x=1.0; y=1.0; }; };
};

defendingFormation = {
  formationIds = [defending020];
  ballEffect = { xAnchor=0; xRange = { min=-1000; max=500; }; scale = { x=1.0; y=1.0; }; };
};
