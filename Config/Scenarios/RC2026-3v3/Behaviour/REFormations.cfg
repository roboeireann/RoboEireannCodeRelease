// 3v3 formations for RC2026. Player numbers are 1 (goalkeeper), 2 (defender),
// 3 (striker) - sequential numbering. Player 3 plays the forward/striker role,
// the equivalent of player 5's role in the 5v5 formation.
//
// The defender plays as a standard supporter (not the RLDefenderNeuralControl
// behaviour - PlayingStateTask currently always falls through to
// supporterPlayingTask() for the centreBack role regardless, since the RL
// branch is commented out there).
//
// All three players sit on a single straight line up the pitch (y = 0): goalie
// deepest, defender in the middle, striker most advanced. Not spread laterally.
// Goalie position is between the posts (xPosOwnGoalLine) in every formation -
// note its actual in-game positioning (WalkToGoaliePoseTask) is hardcoded to the
// goal line independently of this formation regardless; this formation only
// governs READY-state/kickoff positioning and (for the other two roles) the
// supporter target pose during play.
//
// kickoffForward020/defendingKickoff020 respect the actual kickoff rules: on our
// kickoff the non-kicker sits behind the ball rather than at it; on the
// opponent's kickoff both outfield players stay outside the center circle.
// attacking020/defending020 (general play, not kickoff) are simple static lines
// with no ball-tracking shift/scale.
//
// All formation positions are in world (field) coordinates.

formations = {
  kickoffForward020 = {
    formationId = kickoffForward020;
    roles = [goalie, centreBack, forward];
    positions = [
      { x = xPosOwnGoalLine + 200; y = 0; },                    // 1 goalie, between the posts
      { x = xPosOwnPenaltyMark + 100; y = 0; },                 // 2 defender, behind the ball, further back to close the gap to goal
      { x = -centerCircleRadius/2; y = 0; },              // 3 striker, ready to take kickoff
    ];
    yShift = 0;
    yScale = 1.0;
    xAnchor = xPosOwnGoalLine;
    xShift = { min = 0; max = 0; };
    xScale = { min = 1.0; max = 1.0; };
  };

  defendingKickoff020 = {
    formationId = defendingKickoff020;
    roles = [goalie, centreBack, forward];
    positions = [
      { x = xPosOwnGoalLine + 300; y = 0; },                    // 1 goalie, between the posts
      { x = xPosOwnPenaltyMark; y = 0; },                 // 2 defender, outside the center circle, further back to close the gap to goal
      { x = -centerCircleRadius - 250; y = 0; },          // 3 striker, outside the center circle, most advanced
    ];
    yShift = 0;
    yScale = 1.0;
    xAnchor = xPosOwnGoalLine;
    xShift = { min = 0; max = 0; };
    xScale = { min = 1.0; max = 1.0; };
  };

  attacking020 = {
    formationId = attacking020;
    roles = [goalie, centreBack, forward];
    positions = [
      { x = xPosOwnGoalLine; y = 0; },              // 1 goalie, between the posts
      { x = xPosOwnPenaltyArea; y = 0; },        // 2 defender, further back to close the gap to goal
      { x = 0; y = 0; },                            // 3 striker, pushed up to the halfway line
    ];
    yShift = 0;
    yScale = 1.0;
    xAnchor = xPosOwnPenaltyArea;
    xShift = { min = 0; max = 0; };
    xScale = { min = 1.0; max = 1.0; };
  };

  defending020 = {
    formationId = defending020;
    roles = [goalie, centreBack, forward];
    positions = [
      { x = xPosOwnGoalLine; y = 0; },              // 1 goalie, between the posts
      { x = xPosOwnPenaltyArea - 200; y = 0; },        // 2 defender, further back to close the gap to goal
      { x = xPosOwnPenaltyArea + 1000; y = 0; },     // 3 striker, modestly forward of the defender
    ];
    yShift = 0;
    yScale = 1.0;
    xAnchor = xPosOwnPenaltyArea;
    xShift = { min = 0; max = 0; };
    xScale = { min = 1.0; max = 1.0; };
  };
};
