// a set of ALL possible formations that can be used - not just the ones used
// in the current game.
// The formations selected for different situations in a game are specified 
// in tactics.cfg, which will reference formations here by their id.
//
// All formation positions are in world (field) coordinates.
// Values should be considered in light of the active field dimensions.

// The defaults here are a for the full size 2020 field

// * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *
// * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *
// ==========================================================
// NOTE: Although these formations are indicate 1-2-3 (for 7 players)
//       in practice it is a 1-2-1 (for 5 players) with 2 players
//       not present on the field for Champions Cup 5v5.
// ==========================================================
// * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *
// * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *

formations = {
  kickoffBackPass123 = { 
    formationId = kickoffBackPass123;
    roles = [goalie, centreBack, midL, midR, forward, forwardR, forwardL];
    positions = [
      { x = xPosOwnGoalLine; y = 0; }, // 1 goalie middle of goal line
      { x = xPosOwnPenaltyArea; y = -275; },  // 2 defender
      { x = -centerCircleRadius; y = 1100; }, // 3 mid L
      { x = -centerCircleRadius; y = -1100; },  // 4 mid R
      { x = -centerCircleRadius + 200; y = 0; },    // 5 striker
      { x = -300; y = 1200; }, // 6 forward R UNUSED
      { x = -300; y = -1200; },  // 7 forward L UNUSED
    ];
    yShift = 1000; // the farthest left that formation can shift
    yScale = 0.7; // how much the formation can contract/expand as it moves left/right
    xAnchor = xPosOwnPenaltyMark; // anchor point for shifting and scaling
    xShift = { min = -1000; max = 1000; }; // farthest back and forward the formation center can shift
    xScale = { min = 0.8; max = 1.0; }; // scaling at shift extremes (will always be no scaling at zero shift)
  };

  defendingKickoff123 = {
    formationId = defendingKickoff123;
    roles = [goalie, centreBack, midL, midR, forward, forwardR, forwardL];
    positions = [
      { x = xPosOwnGoalLine; y = 0; }, // 1. goalie middle of goal line
      { x = xPosOwnPenaltyArea - 500; y = -220; },  // 2. defender
      { x = xPosOwnPenaltyArea - 0; y = 300; }, // 3. mid L
      { x = xPosOwnPenaltyArea + 500; y = -600; },  // 4. mid R
      { x = -centerCircleRadius - 500; y = 100; },    // 5. striker
      { x = -300; y = 1200; }, // 6 forward R UNUSED
      { x = -300; y = -1200; },  // 7 forward L UNUSED
    ];
    yShift = 1000; // the farthest left that formation can shift
    yScale = 0.7; // how much the formation can contract/expand as it moves left/right
    xAnchor = xPosOwnPenaltyArea - 1000; // anchor point for shifting and scaling
    xShift = { min = -500; max = 1000; }; // farthest back and forward the formation center can shift
    xScale = { min = 0.7; max = 0.8; }; // scaling at shift extremes (will always be no scaling at zero shift)
  };

  attacking123 = {
    formationId = attacking123;
    roles = [goalie, centreBack, midL, midR, forward, forwardR, forwardL];
    positions = [
      { x = xPosOwnGoalLine; y = 0; }, // 1 goalie middle of goal line
      { x = xPosOwnPenaltyArea; y = -275; },  // 2 defender
      { x = -500; y = 900; }, // 3 mid L
      { x = -100; y = -900; },  // 4 mid R
      { x = 1500; y = 600; },    // 5 striker
      { x = -300; y = 1200; }, // 6 forward R UNUSED
      { x = -300; y = -1200; },  // 7 forward L UNUSED
    ];
    yShift = 1000; // the farthest left that formation can shift
    yScale = 0.7; // how much the formation can contract/expand as it moves left/right
    xAnchor = xPosOwnPenaltyArea;
    xShift = { min = -1000; max = 1000; }; // farthest back and forward the formation center can shift
    xScale = { min = 0.8; max = 0.8; }; // scaling at shift extremes (will always be no scaling at zero shift)
  };

  defending123 = {
    formationId = defending123;
    roles = [goalie, centreBack, midL, midR, forward, forwardR, forwardL];
    positions = [
      { x = xPosOwnGoalLine; y = 0; }, // 1. goalie middle of goal line
      { x = xPosOwnPenaltyArea - 700; y = -220; },  // 2. defender
      { x = xPosOwnPenaltyArea + 300; y = 600; }, // 3. mid L
      { x = xPosOwnPenaltyArea + 700; y = -800; },  // 4. mid R
      { x = -centerCircleRadius + 300; y = 0; },    // 5. striker
      { x = -300; y = 1200; }, // 6 forward R UNUSED
      { x = -300; y = -1200; },  // 7 forward L UNUSED
    ];
    yShift = 1000; // the farthest left that formation can shift
    yScale = 0.7; // how much the formation can contract/expand as it moves left/right
    xAnchor = xPosOwnPenaltyArea - 700;
    xShift = { min = -500; max = 1000; }; // farthest back and forward the formation center can shift
    xScale = { min = 0.7; max = 0.9; }; // scaling at shift extremes (will always be no scaling at zero shift)
  };
};
