xPosOpponentGoalLine = 4500;            // origin -> middle far goal line (A = 9.0m)
xPosOpponentGoalArea = 3500;            // origin -> middle near goal area line (E = 1.0m)
xPosOpponentPenaltyMark = 3000;         // origin -> middle penalty mark (I = 1.5m)
